<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewAI - Sign Up</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .register-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 450px;
            width: 90%;
            padding: 2rem;
        }
        
        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
        }
        
        .brain-icon {
            color: white;
            font-size: 2rem;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .input-field::placeholder {
            color: #9ca3af;
        }
        
        .select-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            margin-bottom: 1rem;
            background: white;
        }
        
        .select-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .sign-up-btn {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .sign-up-btn:hover {
            background: #0f172a;
        }
        
        .sign-up-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #6b7280;
            font-size: 14px;
        }
        
        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
        }
        
        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
        }
        
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            gap: 8px;
        }
        
        .checkbox-container input[type="checkbox"] {
            margin-top: 2px;
        }
        
        .checkbox-container label {
            font-size: 14px;
            color: #374151;
            line-height: 1.4;
        }
        
        .password-strength {
            margin-top: 4px;
            margin-bottom: 1rem;
        }
        
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        
        .strength-text {
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const RegisterPage = () => {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                password: '',
                confirmPassword: '',
                role: 'candidate',
                company: '',
                phone: ''
            });
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [acceptTerms, setAcceptTerms] = useState(false);
            const [passwordStrength, setPasswordStrength] = useState(0);

            const calculatePasswordStrength = (password) => {
                let strength = 0;
                if (password.length >= 8) strength += 25;
                if (/[a-z]/.test(password)) strength += 25;
                if (/[A-Z]/.test(password)) strength += 25;
                if (/[0-9]/.test(password)) strength += 25;
                return strength;
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));

                if (name === 'password') {
                    setPasswordStrength(calculatePasswordStrength(value));
                }
            };

            const validateForm = () => {
                if (!formData.name.trim()) {
                    setError('Please enter your full name');
                    return false;
                }

                if (!formData.email.trim()) {
                    setError('Please enter your email address');
                    return false;
                }

                if (!formData.email.includes('@')) {
                    setError('Please enter a valid email address');
                    return false;
                }

                if (formData.password.length < 8) {
                    setError('Password must be at least 8 characters long');
                    return false;
                }

                if (formData.password !== formData.confirmPassword) {
                    setError('Passwords do not match');
                    return false;
                }

                if (!acceptTerms) {
                    setError('Please accept the terms and conditions');
                    return false;
                }

                return true;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (!validateForm()) {
                    return;
                }

                setIsLoading(true);

                // Simulate API call delay
                setTimeout(() => {
                    try {
                        // Get existing users
                        const existingUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                        
                        // Check if email already exists
                        if (existingUsers.find(user => user.email === formData.email)) {
                            setError('An account with this email already exists. Please use a different email or sign in.');
                            setIsLoading(false);
                            return;
                        }

                        // Create new user
                        const newUser = {
                            id: Date.now(),
                            name: formData.name,
                            email: formData.email,
                            password: formData.password, // In production, this should be hashed
                            role: formData.role,
                            company: formData.company,
                            phone: formData.phone,
                            createdAt: new Date().toISOString(),
                            isActive: true
                        };

                        // Save to localStorage
                        const updatedUsers = [...existingUsers, newUser];
                        localStorage.setItem('interviewai_registered_users', JSON.stringify(updatedUsers));

                        setSuccess('Account created successfully! Redirecting to login...');

                        // Redirect to login page after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);

                    } catch (err) {
                        setError('Failed to create account. Please try again.');
                    }
                    setIsLoading(false);
                }, 1500);
            };

            const getStrengthColor = () => {
                if (passwordStrength < 50) return '#ef4444';
                if (passwordStrength < 75) return '#f59e0b';
                return '#10b981';
            };

            const getStrengthText = () => {
                if (passwordStrength < 25) return 'Very Weak';
                if (passwordStrength < 50) return 'Weak';
                if (passwordStrength < 75) return 'Good';
                return 'Strong';
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="register-container">
                        {/* Logo */}
                        <div className="logo-circle">
                            <div className="brain-icon">🧠</div>
                        </div>

                        {/* Welcome Text */}
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">
                                Join InterviewAI
                            </h1>
                            <p className="text-gray-600">
                                Create your account to get started
                            </p>
                        </div>

                        {/* Error/Success Messages */}
                        {error && (
                            <div className="error-message">
                                {error}
                            </div>
                        )}
                        
                        {success && (
                            <div className="success-message">
                                {success}
                            </div>
                        )}

                        {/* Registration Form */}
                        <form onSubmit={handleSubmit}>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Full Name *
                                </label>
                                <input
                                    type="text"
                                    name="name"
                                    className="input-field"
                                    placeholder="Enter your full name"
                                    value={formData.name}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                    required
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Email Address *
                                </label>
                                <input
                                    type="email"
                                    name="email"
                                    className="input-field"
                                    placeholder="you@example.com"
                                    value={formData.email}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                    required
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Role *
                                </label>
                                <select
                                    name="role"
                                    className="select-field"
                                    value={formData.role}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                    required
                                >
                                    <option value="candidate">Job Candidate</option>
                                    <option value="hr">HR Manager</option>
                                </select>
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Company/Organization
                                </label>
                                <input
                                    type="text"
                                    name="company"
                                    className="input-field"
                                    placeholder="Your company name (optional)"
                                    value={formData.company}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Phone Number
                                </label>
                                <input
                                    type="tel"
                                    name="phone"
                                    className="input-field"
                                    placeholder="+1 (555) 123-4567 (optional)"
                                    value={formData.phone}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Password *
                                </label>
                                <input
                                    type="password"
                                    name="password"
                                    className="input-field"
                                    placeholder="Create a strong password"
                                    value={formData.password}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                    required
                                />
                                {formData.password && (
                                    <div className="password-strength">
                                        <div 
                                            className="strength-bar"
                                            style={{
                                                width: `${passwordStrength}%`,
                                                backgroundColor: getStrengthColor()
                                            }}
                                        ></div>
                                        <div 
                                            className="strength-text"
                                            style={{ color: getStrengthColor() }}
                                        >
                                            Password strength: {getStrengthText()}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Confirm Password *
                                </label>
                                <input
                                    type="password"
                                    name="confirmPassword"
                                    className="input-field"
                                    placeholder="Confirm your password"
                                    value={formData.confirmPassword}
                                    onChange={handleInputChange}
                                    disabled={isLoading}
                                    required
                                />
                            </div>

                            <div className="checkbox-container">
                                <input
                                    type="checkbox"
                                    id="acceptTerms"
                                    checked={acceptTerms}
                                    onChange={(e) => setAcceptTerms(e.target.checked)}
                                    disabled={isLoading}
                                />
                                <label htmlFor="acceptTerms">
                                    I agree to the <a href="#" className="text-blue-600 hover:underline">Terms of Service</a> and <a href="#" className="text-blue-600 hover:underline">Privacy Policy</a>
                                </label>
                            </div>

                            <button 
                                type="submit" 
                                className="sign-up-btn"
                                disabled={isLoading}
                            >
                                {isLoading ? (
                                    <div className="flex items-center justify-center">
                                        <div className="loading"></div>
                                        <span className="ml-2">Creating account...</span>
                                    </div>
                                ) : (
                                    'Create Account'
                                )}
                            </button>
                        </form>

                        {/* Footer Links */}
                        <div className="footer-links">
                            <span>Already have an account? </span>
                            <a href="login.html">Sign in</a>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<RegisterPage />, document.getElementById('root'));
    </script>
</body>
</html>
