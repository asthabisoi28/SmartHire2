<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview System</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sidebar { background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%); }
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background-color: rgba(255, 255, 255, 0.1); }
        .status-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .status-scheduled { background-color: #dbeafe; color: #1e40af; }
        .status-in-progress { background-color: #fef3c7; color: #d97706; }
        .status-completed { background-color: #d1fae5; color: #059669; }
        .status-cancelled { background-color: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { HashRouter, Routes, Route, Link, useNavigate } = ReactRouterDOM;

        // Import our entities (simplified for browser)
        class User {
            constructor(data = {}) {
                this.id = data.id || null;
                this.email = data.email || '';
                this.full_name = data.full_name || '';
                this.user_type = data.user_type || 'candidate';
                this.avatar_url = data.avatar_url || '';
            }

            static async me() {
                // Mock user data for demo
                return new User({
                    id: 1,
                    full_name: 'John Doe',
                    email: 'john.doe@example.com',
                    user_type: 'candidate',
                    avatar_url: ''
                });
            }

            static async logout() {
                console.log('Logout clicked');
                return true;
            }

            getInitials() {
                return this.full_name
                    .split(' ')
                    .map(name => name.charAt(0))
                    .join('')
                    .toUpperCase()
                    .slice(0, 2);
            }
        }

        class Interview {
            constructor(data = {}) {
                this.id = data.id || null;
                this.candidate_id = data.candidate_id || '';
                this.job_title = data.job_title || '';
                this.status = data.status || 'scheduled';
                this.stage = data.stage || 'ats';
                this.ats_score = data.ats_score || null;
                this.technical_score = data.technical_score || null;
                this.interview_score = data.interview_score || null;
                this.scheduled_time = data.scheduled_time || null;
            }

            static async getAll() {
                // Mock interview data
                return [
                    new Interview({
                        id: 1,
                        job_title: 'Frontend Developer',
                        status: 'in_progress',
                        stage: 'technical',
                        ats_score: 85,
                        scheduled_time: '2024-01-15T10:00:00Z'
                    }),
                    new Interview({
                        id: 2,
                        job_title: 'Full Stack Engineer',
                        status: 'completed',
                        stage: 'completed',
                        ats_score: 92,
                        technical_score: 78,
                        interview_score: 85,
                        scheduled_time: '2024-01-10T14:00:00Z'
                    })
                ];
            }

            getStatusColor() {
                const colors = {
                    scheduled: 'status-scheduled',
                    in_progress: 'status-in-progress',
                    completed: 'status-completed',
                    cancelled: 'status-cancelled'
                };
                return colors[this.status] || 'status-scheduled';
            }
        }

        // Utility functions
        function createPageUrl(pageName) {
            const routes = {
                CandidateDashboard: '/candidate/dashboard',
                ATSChecker: '/candidate/ats-checker',
                TechnicalTest: '/candidate/technical-test',
                InterviewRoom: '/candidate/interview',
                HRDashboard: '/hr/dashboard',
                CandidateManagement: '/hr/candidates',
                Analytics: '/hr/analytics',
                Home: '/',
                LiveInterview: '/interview/live'
            };
            return routes[pageName] || '/';
        }

        function formatDate(date) {
            if (!date) return '';
            return new Date(date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Layout Component
        function Layout({ children, currentPageName }) {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadUser = async () => {
                    try {
                        const userData = await User.me();
                        setUser(userData);
                    } catch (error) {
                        setUser(null);
                    }
                    setLoading(false);
                };
                loadUser();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center gradient-bg">
                        <div className="flex items-center gap-3">
                            <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                            <span className="text-lg font-medium text-white">Loading...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 flex">
                    {/* Sidebar */}
                    <div className="w-64 sidebar text-white">
                        <div className="p-6">
                            <div className="flex items-center gap-3 mb-8">
                                <div className="w-10 h-10 bg-white bg-opacity-20 rounded-xl flex items-center justify-center">
                                    <span className="text-white font-bold text-lg">🧠</span>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold">InterviewAI</h1>
                                    <p className="text-blue-200 text-sm">Smart Interviews</p>
                                </div>
                            </div>

                            <nav className="space-y-2">
                                <Link to="/" className="nav-item flex items-center gap-3 px-3 py-2 rounded-lg">
                                    <span>🏠</span> Home
                                </Link>
                                <Link to="/candidate/dashboard" className="nav-item flex items-center gap-3 px-3 py-2 rounded-lg">
                                    <span>📊</span> Dashboard
                                </Link>
                                <Link to="/candidate/ats-checker" className="nav-item flex items-center gap-3 px-3 py-2 rounded-lg">
                                    <span>📄</span> ATS Checker
                                </Link>
                                <Link to="/candidate/technical-test" className="nav-item flex items-center gap-3 px-3 py-2 rounded-lg">
                                    <span>💻</span> Technical Test
                                </Link>
                                <Link to="/candidate/interview" className="nav-item flex items-center gap-3 px-3 py-2 rounded-lg">
                                    <span>🎥</span> Interview Room
                                </Link>
                            </nav>
                        </div>

                        {user && (
                            <div className="absolute bottom-0 left-0 right-0 p-6 border-t border-blue-600">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                                        <span className="text-white font-semibold text-sm">
                                            {user.getInitials()}
                                        </span>
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-white font-medium truncate">{user.full_name}</p>
                                        <p className="text-blue-200 text-sm truncate">{user.email}</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Main Content */}
                    <div className="flex-1">
                        <main className="p-8">
                            {children}
                        </main>
                    </div>
                </div>
            );
        }

        // Page Components
        function Home() {
            return (
                <div className="text-center py-12">
                    <div className="max-w-3xl mx-auto">
                        <h1 className="text-4xl font-bold text-gray-900 mb-6">
                            Welcome to InterviewAI
                        </h1>
                        <p className="text-xl text-gray-600 mb-8">
                            The smart way to conduct and manage interviews with AI-powered insights
                        </p>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="card p-6 text-center">
                                <div className="text-4xl mb-4">📄</div>
                                <h3 className="text-lg font-semibold mb-2">ATS Checking</h3>
                                <p className="text-gray-600">Automated resume screening and compatibility analysis</p>
                            </div>
                            <div className="card p-6 text-center">
                                <div className="text-4xl mb-4">💻</div>
                                <h3 className="text-lg font-semibold mb-2">Technical Tests</h3>
                                <p className="text-gray-600">Coding challenges with real-time monitoring</p>
                            </div>
                            <div className="card p-6 text-center">
                                <div className="text-4xl mb-4">🎥</div>
                                <h3 className="text-lg font-semibold mb-2">Live Interviews</h3>
                                <p className="text-gray-600">AI-assisted video interviews with insights</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CandidateDashboard() {
            const [interviews, setInterviews] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadInterviews = async () => {
                    try {
                        const data = await Interview.getAll();
                        setInterviews(data);
                    } catch (error) {
                        console.error('Error loading interviews:', error);
                    }
                    setLoading(false);
                };
                loadInterviews();
            }, []);

            if (loading) {
                return <div className="text-center py-8">Loading dashboard...</div>;
            }

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-900">Candidate Dashboard</h2>
                        <p className="text-gray-600">Track your interview progress and upcoming tests</p>
                    </div>

                    {/* Stats Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <span className="text-blue-600 text-xl">📊</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Active Applications</p>
                                    <p className="text-2xl font-bold text-gray-900">{interviews.length}</p>
                                </div>
                            </div>
                        </div>

                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                                    <span className="text-green-600 text-xl">✅</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Completed Tests</p>
                                    <p className="text-2xl font-bold text-gray-900">
                                        {interviews.filter(i => i.status === 'completed').length}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                                    <span className="text-yellow-600 text-xl">⏰</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Pending Interviews</p>
                                    <p className="text-2xl font-bold text-gray-900">
                                        {interviews.filter(i => i.status === 'in_progress').length}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Interview List */}
                    <div className="card p-6">
                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Your Interviews</h3>
                        <div className="space-y-4">
                            {interviews.map(interview => (
                                <div key={interview.id} className="border border-gray-200 rounded-lg p-4">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h4 className="font-medium text-gray-900">{interview.job_title}</h4>
                                            <p className="text-sm text-gray-600">
                                                Scheduled: {formatDate(interview.scheduled_time)}
                                            </p>
                                        </div>
                                        <span className={`status-badge ${interview.getStatusColor()}`}>
                                            {interview.status.replace('_', ' ')}
                                        </span>
                                    </div>
                                    
                                    <div className="mt-3 flex gap-4 text-sm">
                                        <span>ATS: {interview.ats_score || 'N/A'}%</span>
                                        <span>Technical: {interview.technical_score || 'Pending'}%</span>
                                        <span>Interview: {interview.interview_score || 'Pending'}%</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function ATSChecker() {
            return (
                <div className="max-w-2xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-900 mb-6">ATS Resume Checker</h2>
                    <div className="card p-8 text-center">
                        <div className="text-6xl mb-4">📄</div>
                        <h3 className="text-xl font-semibold mb-4">Upload Your Resume</h3>
                        <p className="text-gray-600 mb-6">
                            Get instant feedback on your resume's ATS compatibility and optimization suggestions.
                        </p>
                        <button className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                            Choose File
                        </button>
                    </div>
                </div>
            );
        }

        function TechnicalTest() {
            return (
                <div>
                    <h2 className="text-2xl font-bold text-gray-900 mb-6">Technical Assessment</h2>
                    <div className="card p-6">
                        <div className="text-center py-8">
                            <div className="text-6xl mb-4">💻</div>
                            <h3 className="text-xl font-semibold mb-4">Ready for Your Technical Test?</h3>
                            <p className="text-gray-600 mb-6">
                                Complete coding challenges to demonstrate your technical skills.
                            </p>
                            <button className="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
                                Start Test
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function InterviewRoom() {
            return (
                <div>
                    <h2 className="text-2xl font-bold text-gray-900 mb-6">Interview Room</h2>
                    <div className="card p-6">
                        <div className="text-center py-8">
                            <div className="text-6xl mb-4">🎥</div>
                            <h3 className="text-xl font-semibold mb-4">Join Your Interview</h3>
                            <p className="text-gray-600 mb-6">
                                Connect with your interviewer for a live video session.
                            </p>
                            <button className="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700">
                                Join Interview
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            return (
                <HashRouter>
                    <Routes>
                        <Route path="/" element={
                            <Layout currentPageName="Home">
                                <Home />
                            </Layout>
                        } />
                        <Route path="/candidate/dashboard" element={
                            <Layout currentPageName="CandidateDashboard">
                                <CandidateDashboard />
                            </Layout>
                        } />
                        <Route path="/candidate/ats-checker" element={
                            <Layout currentPageName="ATSChecker">
                                <ATSChecker />
                            </Layout>
                        } />
                        <Route path="/candidate/technical-test" element={
                            <Layout currentPageName="TechnicalTest">
                                <TechnicalTest />
                            </Layout>
                        } />
                        <Route path="/candidate/interview" element={
                            <Layout currentPageName="InterviewRoom">
                                <InterviewRoom />
                            </Layout>
                        } />
                    </Routes>
                </HashRouter>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
