<!DOCTYPE html>
<html>
<head>
    <title>OAuth Test</title>
</head>
<body>
    <h2>Google OAuth Test Page</h2>
    <p>This page helps verify your OAuth setup:</p>
    
    <div id="status"></div>
    
    <script>
        // Check if we're in an OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const state = urlParams.get('state');
        
        const statusDiv = document.getElementById('status');
        
        if (error) {
            statusDiv.innerHTML = `
                <div style="color: red; padding: 10px; border: 1px solid red; border-radius: 5px;">
                    <strong>OAuth Error:</strong> ${error}<br>
                    <small>This usually means the user cancelled or there's a configuration issue.</small>
                </div>
            `;
        } else if (code) {
            statusDiv.innerHTML = `
                <div style="color: green; padding: 10px; border: 1px solid green; border-radius: 5px;">
                    <strong>OAuth Success!</strong><br>
                    Authorization Code: ${code.substring(0, 20)}...<br>
                    State: ${state}<br>
                    <small>OAuth flow is working correctly!</small>
                </div>
            `;
        } else {
            statusDiv.innerHTML = `
                <div style="color: blue; padding: 10px; border: 1px solid blue; border-radius: 5px;">
                    <strong>Ready to test OAuth</strong><br>
                    <small>No OAuth parameters detected. This page is ready for testing.</small>
                </div>
            `;
        }
        
        // Auto-redirect to login page after 3 seconds if we got a successful callback
        if (code) {
            setTimeout(() => {
                window.location.href = '/login.html?oauth_test=success';
            }, 3000);
        }
    </script>
</body>
</html>
