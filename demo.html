<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview System - Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple User class for demo
        class User {
            constructor(data = {}) {
                this.id = data.id || null;
                this.full_name = data.full_name || 'Demo User';
                this.email = data.email || 'demo@example.com';
                this.user_type = data.user_type || 'candidate';
            }

            static async me() {
                // Mock user data for demo
                return new User({
                    id: 1,
                    full_name: 'John Doe',
                    email: 'john.doe@example.com',
                    user_type: 'candidate'
                });
            }

            static async logout() {
                console.log('Logout clicked');
                return true;
            }
        }

        // Simple Layout component
        function Layout({ children, currentPageName }) {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadUser = async () => {
                    try {
                        const userData = await User.me();
                        setUser(userData);
                    } catch (error) {
                        setUser(null);
                    }
                    setLoading(false);
                };
                loadUser();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center gradient-bg">
                        <div className="flex items-center gap-3">
                            <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                            <span className="text-lg font-medium text-white">Loading...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center py-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center">
                                        <span className="text-white font-bold text-lg">🧠</span>
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">InterviewAI</h1>
                                        <p className="text-sm text-gray-500">Smart Interview System</p>
                                    </div>
                                </div>
                                
                                {user && (
                                    <div className="flex items-center gap-4">
                                        <div className="text-right">
                                            <p className="text-sm font-medium text-gray-900">{user.full_name}</p>
                                            <p className="text-xs text-gray-500">{user.email}</p>
                                        </div>
                                        <div className="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
                                            <span className="text-white font-semibold text-sm">
                                                {user.full_name?.charAt(0) || 'U'}
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="bg-white border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-8 py-3">
                                <a href="#dashboard" className="text-blue-600 font-medium">Dashboard</a>
                                <a href="#ats" className="text-gray-600 hover:text-blue-600">ATS Checker</a>
                                <a href="#technical" className="text-gray-600 hover:text-blue-600">Technical Test</a>
                                <a href="#interview" className="text-gray-600 hover:text-blue-600">Interview</a>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {children}
                    </main>
                </div>
            );
        }

        // Demo Dashboard Component
        function DemoDashboard() {
            const [interviews, setInterviews] = useState([
                {
                    id: 1,
                    job_title: 'Frontend Developer',
                    status: 'in_progress',
                    stage: 'technical',
                    ats_score: 85,
                    technical_score: null,
                    interview_score: null,
                    scheduled_time: '2024-01-15T10:00:00Z'
                },
                {
                    id: 2,
                    job_title: 'Full Stack Engineer',
                    status: 'completed',
                    stage: 'completed',
                    ats_score: 92,
                    technical_score: 78,
                    interview_score: 85,
                    scheduled_time: '2024-01-10T14:00:00Z'
                }
            ]);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-900">Candidate Dashboard</h2>
                        <p className="text-gray-600">Track your interview progress and upcoming tests</p>
                    </div>

                    {/* Stats Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <span className="text-blue-600 text-xl">📊</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Active Applications</p>
                                    <p className="text-2xl font-bold text-gray-900">2</p>
                                </div>
                            </div>
                        </div>

                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                                    <span className="text-green-600 text-xl">✅</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Completed Tests</p>
                                    <p className="text-2xl font-bold text-gray-900">1</p>
                                </div>
                            </div>
                        </div>

                        <div className="card p-6">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                                    <span className="text-yellow-600 text-xl">⏰</span>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Pending Interviews</p>
                                    <p className="text-2xl font-bold text-gray-900">1</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Interview List */}
                    <div className="card p-6">
                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Your Interviews</h3>
                        <div className="space-y-4">
                            {interviews.map(interview => (
                                <div key={interview.id} className="border border-gray-200 rounded-lg p-4">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h4 className="font-medium text-gray-900">{interview.job_title}</h4>
                                            <p className="text-sm text-gray-600">
                                                Scheduled: {new Date(interview.scheduled_time).toLocaleDateString()}
                                            </p>
                                        </div>
                                        <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                            interview.status === 'completed' ? 'bg-green-100 text-green-800' :
                                            interview.status === 'in_progress' ? 'bg-yellow-100 text-yellow-800' :
                                            'bg-blue-100 text-blue-800'
                                        }`}>
                                            {interview.status.replace('_', ' ')}
                                        </span>
                                    </div>
                                    
                                    <div className="mt-3 flex gap-4 text-sm">
                                        <span>ATS: {interview.ats_score || 'N/A'}%</span>
                                        <span>Technical: {interview.technical_score || 'Pending'}%</span>
                                        <span>Interview: {interview.interview_score || 'Pending'}%</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Quick Actions */}
                    <div className="card p-6">
                        <h3 className="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <button className="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 text-left">
                                <div className="text-blue-600 text-2xl mb-2">📄</div>
                                <h4 className="font-medium text-gray-900">Upload Resume</h4>
                                <p className="text-sm text-gray-600">Check ATS compatibility</p>
                            </button>
                            
                            <button className="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 text-left">
                                <div className="text-green-600 text-2xl mb-2">💻</div>
                                <h4 className="font-medium text-gray-900">Take Test</h4>
                                <p className="text-sm text-gray-600">Complete technical assessment</p>
                            </button>
                            
                            <button className="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 text-left">
                                <div className="text-purple-600 text-2xl mb-2">🎥</div>
                                <h4 className="font-medium text-gray-900">Join Interview</h4>
                                <p className="text-sm text-gray-600">Start video interview</p>
                            </button>
                            
                            <button className="p-4 border border-gray-200 rounded-lg hover:bg-gray-50 text-left">
                                <div className="text-orange-600 text-2xl mb-2">📊</div>
                                <h4 className="font-medium text-gray-900">View Results</h4>
                                <p className="text-sm text-gray-600">Check your scores</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            return (
                <Layout currentPageName="CandidateDashboard">
                    <DemoDashboard />
                </Layout>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
