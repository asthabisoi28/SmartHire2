<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview System - Fixed Version</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monaco Editor AMD loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.41.0/min/vs/loader.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sidebar { background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useRef } = React;

        // Lightweight Monaco Editor React wrapper for this standalone page
        function MonacoEditor({ language = 'javascript', value = '', onChange, height = '256px' }) {
            const containerRef = React.useRef(null);
            const editorRef = React.useRef(null);
            const currentValueRef = React.useRef(value);

            const mapLang = (lang) => {
                if (lang === 'python') return 'python';
                if (lang === 'java') return 'java';
                if (lang === 'c') return 'cpp';
                if (lang === 'javascript') return 'javascript';
                return 'javascript';
            };

            React.useEffect(() => {
                const el = containerRef.current;
                if (!el) return;
                if (!window.require) return;

                window.require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.41.0/min/vs' } });
                window.require(['vs/editor/editor.main'], function () {
                    try { window.monaco?.editor?.setTabFocusMode?.(false); } catch (e) {}

                    if (editorRef.current) {
                        try { editorRef.current.dispose(); } catch {}
                        editorRef.current = null;
                    }

                    const monaco = window.monaco;
                    try {
                        monaco.languages.setLanguageConfiguration('python', {
                            onEnterRules: [
                                {
                                    beforeText: /^(\s*)(def|class|if|elif|else|for|while|try|except|finally|with)\b.*:\s*$/,
                                    action: { indentAction: monaco.languages.IndentAction.Indent }
                                }
                            ],
                            autoClosingPairs: [
                                { open: '"', close: '"' },
                                { open: "'", close: "'" },
                                { open: '(', close: ')' },
                                { open: '[', close: ']' },
                                { open: '{', close: '}' },
                            ],
                        });
                    } catch (e) {}

                    editorRef.current = monaco.editor.create(el, {
                        value: currentValueRef.current,
                        language: mapLang(language),
                        theme: 'vs-dark',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        scrollBeyondLastLine: false,
                        wordWrap: 'on',
                        insertSpaces: true,
                        tabSize: 2,
                        autoIndent: 'full',
                    });

                    const sub = editorRef.current.onDidChangeModelContent(() => {
                        const v = editorRef.current.getValue();
                        currentValueRef.current = v;
                        onChange && onChange(v);
                    });

                    return () => { try { sub?.dispose?.(); } catch {} };
                });

                return () => {
                    if (editorRef.current) {
                        try { editorRef.current.dispose(); } catch {}
                        editorRef.current = null;
                    }
                };
            }, [language]);

            React.useEffect(() => {
                currentValueRef.current = value ?? '';
                const ed = editorRef.current;
                if (ed && ed.getValue() !== currentValueRef.current) {
                    ed.setValue(currentValueRef.current);
                }
            }, [value]);

            return React.createElement('div', { ref: containerRef, style: { height } });
        }
        
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [notifications, setNotifications] = useState([]);
            const [userRole, setUserRole] = useState('candidate');
            const [candidateNotifications, setCandidateNotifications] = useState([]);
            const [currentUser, setCurrentUser] = useState({});
            
            // Check user role on component mount
            React.useEffect(() => {
                const userData = localStorage.getItem('interviewai_user');
                if (userData) {
                    const user = JSON.parse(userData);
                    setUserRole(user.role || 'candidate');
                } else {
                    // Redirect to login if no user data
                    window.location.href = 'login.html';
                }

                // Listen for navigation events from child components
                const handleNavigation = (event) => {
                    if (event.detail && event.detail.page) {
                        setCurrentPage(event.detail.page);
                    }
                };

                window.addEventListener('navigateToPage', handleNavigation);

                // Cleanup event listener
                return () => {
                    window.removeEventListener('navigateToPage', handleNavigation);
                };
            }, []);
            
            const addNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 5000);
            };
            
            // Role-based navigation items
            const getNavigationItems = () => {
                if (userRole === 'hr') {
                    return [
                        { id: 'home', label: '🏠 Home', page: 'home' },
                        { id: 'dashboard', label: '📊 Dashboard', page: 'dashboard' },
                        { id: 'candidates', label: '👥 Candidates', page: 'candidates' },
                        { id: 'analytics', label: '📈 Analytics', page: 'analytics' }
                    ];
                } else {
                    // Default to candidate role
                    return [
                        { id: 'home', label: '🏠 Home', page: 'home' },
                        { id: 'ats', label: '📄 Resume Check', page: 'ats' },
                        { id: 'technical', label: '💻 Technical Test', page: 'technical' },
                        { id: 'interview', label: '🎥 Interview Room', page: 'interview', locked: false },
                        { id: 'analysis', label: '📊 Analysis', page: 'analysis' }
                    ];
                }
            };
            
            const navigationItems = getNavigationItems();
            
            return React.createElement('div', { className: 'min-h-screen flex' },
                // Sidebar
                React.createElement('div', { className: 'w-64 sidebar text-white p-6' },
                    React.createElement('div', { className: 'mb-8' },
                        React.createElement('h1', { className: 'text-2xl font-bold mb-2' }, '🤖 InterviewAI'),
                        React.createElement('p', { className: 'text-sm opacity-75 capitalize' }, `${userRole} Portal`)
                    ),
                    React.createElement('nav', { className: 'space-y-3' },
                        navigationItems.map(item => {
                            // Check if this is the interview room and user is candidate
                            const isInterviewRoom = item.id === 'interview';
                            const isCandidate = userRole === 'candidate';
                            const isLocked = false;
                            
                            // For candidates, check if they're qualified for interview room
                            let isAccessible = true;
                            let lockReason = '';
                            
                            if (false) {
                                // Get current user qualification status
                                const userData = localStorage.getItem('interviewai_user');
                                if (userData) {
                                    const user = JSON.parse(userData);
                                    const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                                    const userRecord = registeredUsers.find(u => u.email === user.email);
                                    
                                    if (userRecord) {
                                        const atsResults = JSON.parse(localStorage.getItem('ats_results') || '{}');
                                        const technicalResults = JSON.parse(localStorage.getItem('technical_results') || '{}');
                                        
                                        const userAtsResults = atsResults[userRecord.id];
                                        const userTechnicalResults = technicalResults[userRecord.id];
                                        
                                        const resumeCompleted = userAtsResults?.completed || false;
                                        const technicalCompleted = userTechnicalResults?.overall?.completed || false;
                                        
                                        if (!resumeCompleted || !technicalCompleted) {
                                            isAccessible = false;
                                            lockReason = 'Complete assessments first';
                                        } else {
                                            const resumeScore = userAtsResults.score || 0;
                                            const aptitudeScore = userTechnicalResults.aptitude?.aptitudeScore || 0;
                                            const codingScore = userTechnicalResults.coding?.codingScore || 0;
                                            const aggregateScore = Math.round(
                                                (resumeScore * 0.3) + 
                                                (aptitudeScore * 0.35) + 
                                                (codingScore * 0.35)
                                            );
                                            
                                            if (aggregateScore < 70) {
                                                isAccessible = false;
                                                lockReason = `Need 70% score (${aggregateScore}%)`;
                                            }
                                        }
                                    }
                                }
                            }
                            
                            return React.createElement('button', {
                                key: item.id,
                                className: `w-full text-left px-4 py-3 rounded-lg transition-all relative ${
                                    currentPage === item.page ? 'bg-white bg-opacity-20' : 
                                    isLocked && !isAccessible ? 'bg-red-900 bg-opacity-20 cursor-not-allowed opacity-75' :
                                    'hover:bg-white hover:bg-opacity-10'
                                }`,
                                onClick: () => {
                                    if (isLocked && !isAccessible) {
                                        // Show notification about being locked
                                        addNotification(`🔒 Interview Room Locked: ${lockReason}`, 'error');
                                        return;
                                    }
                                    setCurrentPage(item.page);
                                },
                                title: isLocked && !isAccessible ? `Locked: ${lockReason}` : ''
                            }, 
                                React.createElement('div', { className: 'flex items-center justify-between' },
                                    React.createElement('span', {}, 
                                        isLocked && !isAccessible ? `🔒 ${item.label.replace('🎥', '')}` : item.label
                                    ),
                                    isLocked && !isAccessible && React.createElement('span', { 
                                        className: 'text-xs bg-red-500 text-white px-2 py-1 rounded-full' 
                                    }, 'LOCKED')
                                )
                            );
                        })
                    ),
                    // User info and logout
                    React.createElement('div', { className: 'mt-auto pt-6 border-t border-white border-opacity-20' },
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('p', { className: 'text-sm opacity-75' }, 'Logged in as:'),
                            React.createElement('p', { className: 'text-sm font-semibold' }, 
                                JSON.parse(localStorage.getItem('interviewai_user') || '{}').name || 'User'
                            )
                        ),
                        React.createElement('button', {
                            className: 'w-full text-left px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 transition-all text-sm',
                            onClick: () => {
                                localStorage.removeItem('interviewai_user');
                                window.location.href = 'login.html';
                            }
                        }, '🚪 Logout')
                    )
                ),
                
                // Main Content
                React.createElement('div', { className: 'flex-1 gradient-bg' },
                    // Urgent notification banner for candidates
                    userRole === 'candidate' && candidateNotifications.some(n => n.urgent && !n.read) && React.createElement('div', { 
                        className: 'bg-red-600 text-white p-4 text-center animate-pulse fixed top-0 left-0 right-0 z-50 shadow-lg' 
                    },
                        React.createElement('div', { className: 'flex items-center justify-center space-x-2' },
                            React.createElement('span', { className: 'text-2xl' }, '🚨'),
                            React.createElement('span', { className: 'font-bold text-lg' }, 
                                candidateNotifications.find(n => n.urgent && !n.read)?.title || 'Urgent Notification'
                            ),
                            React.createElement('span', { className: 'text-2xl' }, '🚨')
                        ),
                        React.createElement('p', { className: 'mt-2 text-sm' }, 
                            candidateNotifications.find(n => n.urgent && !n.read)?.message || 'Please check your notifications'
                        ),
                        React.createElement('button', {
                            className: 'mt-2 bg-white text-red-600 px-4 py-2 rounded font-semibold hover:bg-gray-100 transition-colors',
                            onClick: () => {
                                const urgentNotif = candidateNotifications.find(n => n.urgent && !n.read);
                                if (urgentNotif) markNotificationAsRead(urgentNotif.id);
                            }
                        }, 'Acknowledge & Join Interview')
                    ),
                    // Notifications
                    notifications.length > 0 && React.createElement('div', { className: 'fixed top-4 right-4 z-40 space-y-2' },
                        notifications.map(notification =>
                            React.createElement('div', {
                                key: notification.id,
                                className: `px-4 py-3 rounded-lg shadow-lg text-white ${
                                    notification.type === 'success' ? 'bg-green-500' :
                                    notification.type === 'error' ? 'bg-red-500' :
                                    notification.type === 'warning' ? 'bg-yellow-500' :
                                    'bg-blue-500'
                                }`
                            }, notification.message)
                        )
                    ),
                    
                    React.createElement('div', { className: 'p-8' },
                        currentPage === 'home' && React.createElement(HomePage, { addNotification, setCurrentPage }),
                        currentPage === 'dashboard' && React.createElement(DashboardPage, { addNotification, setCurrentPage }),
                        currentPage === 'ats' && React.createElement(ATSPage, { addNotification }),
                        currentPage === 'technical' && React.createElement(TechnicalPage, { addNotification }),
                        currentPage === 'scheduled' && React.createElement(ScheduledInterviewsPage, { addNotification, setCurrentPage }),
                        currentPage === 'analysis' && React.createElement(AnalysisPage, { addNotification, setCurrentPage }),
                        currentPage === 'interview' && React.createElement(InterviewPage, { addNotification }),
                        currentPage === 'candidates' && React.createElement(CandidatesPage, { addNotification }),
                        currentPage === 'analytics' && React.createElement(AnalyticsPage, { addNotification, setCurrentPage })
                    )
                )
            );
        }
        
        function HomePage({ addNotification, setCurrentPage }) {
            const [userRole, setUserRole] = useState('candidate');
            const [candidateNotifications, setCandidateNotifications] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);

            React.useEffect(() => {
                const userData = localStorage.getItem('interviewai_user');
                if (userData) {
                    const user = JSON.parse(userData);
                    setUserRole(user.role || 'candidate');
                    setCurrentUser(user);
                    
                    // Load candidate notifications if user is a candidate
                    if (user.role === 'candidate') {
                        // Use user ID from registered users to match notifications
                        const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                        const registeredUser = registeredUsers.find(u => u.email === user.email);
                        if (registeredUser) {
                            const notifications = JSON.parse(localStorage.getItem(`candidate_notifications_${registeredUser.id}`) || '[]');
                            setCandidateNotifications(notifications);
                            
                            // Set up polling for real-time notifications
                            const pollInterval = setInterval(() => {
                                const updatedNotifications = JSON.parse(localStorage.getItem(`candidate_notifications_${registeredUser.id}`) || '[]');
                                setCandidateNotifications(updatedNotifications);
                            }, 2000); // Check every 2 seconds
                            
                            // Cleanup interval on unmount
                            return () => clearInterval(pollInterval);
                        }
                    }
                }
            }, []);

            const markNotificationAsRead = (notificationId) => {
                const updatedNotifications = candidateNotifications.map(notif => 
                    notif.id === notificationId ? { ...notif, read: true } : notif
                );
                setCandidateNotifications(updatedNotifications);
                
                // Update localStorage with user ID
                const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                const registeredUser = registeredUsers.find(u => u.email === currentUser.email);
                if (registeredUser) {
                    localStorage.setItem(`candidate_notifications_${registeredUser.id}`, JSON.stringify(updatedNotifications));
                }
            };

            const formatInterviewDateTime = (date, time) => {
                const dateObj = new Date(`${date}T${time}`);
                return dateObj.toLocaleString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            // Sync existing interview statuses from HR portal to candidate notifications
            const syncInterviewStatuses = () => {
                const scheduledInterviews = JSON.parse(localStorage.getItem('scheduled_interviews') || '[]');
                const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                
                scheduledInterviews.forEach(interview => {
                    if (interview.candidateId) {
                        const candidateNotifications = JSON.parse(localStorage.getItem(`candidate_notifications_${interview.candidateId}`) || '[]');
                        
                        // Update the original interview notification status to match HR portal
                        const updatedNotifications = candidateNotifications.map(notif => {
                            if (notif.type === 'interview_scheduled' && 
                                notif.date === interview.date && 
                                notif.time === interview.time &&
                                notif.interviewType === interview.type) {
                                
                                if (interview.status === 'cancelled') {
                                    return {
                                        ...notif,
                                        status: 'cancelled',
                                        title: 'Interview Cancelled',
                                        message: `Your ${interview.type} interview scheduled for ${interview.date} at ${interview.time} has been cancelled.`,
                                        cancelledAt: interview.cancelledAt || new Date().toISOString(),
                                        cancelledBy: interview.cancelledBy || 'HR Manager'
                                    };
                                } else if (interview.status === 'completed') {
                                    return {
                                        ...notif,
                                        status: 'completed',
                                        title: 'Interview Completed',
                                        message: `Your ${interview.type} interview has been completed successfully. Our team will review your responses and get back to you soon.`,
                                        completedAt: interview.completedAt || new Date().toISOString()
                                    };
                                }
                            }
                            return notif;
                        });
                        
                        localStorage.setItem(`candidate_notifications_${interview.candidateId}`, JSON.stringify(updatedNotifications));
                    }
                });
            };

            // Run sync on page load
            React.useEffect(() => {
                syncInterviewStatuses();
            }, []);

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                // Hero Section with animated background
                React.createElement('div', { className: 'relative text-center mb-12 py-16 px-8 rounded-3xl bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 overflow-hidden' },
                    // Animated background elements
                    React.createElement('div', { className: 'absolute inset-0 opacity-20' },
                        React.createElement('div', { className: 'absolute top-10 left-10 w-20 h-20 bg-white rounded-full animate-pulse' }),
                        React.createElement('div', { className: 'absolute top-32 right-20 w-16 h-16 bg-yellow-300 rounded-full animate-bounce' }),
                        React.createElement('div', { className: 'absolute bottom-20 left-1/4 w-12 h-12 bg-pink-300 rounded-full animate-ping' }),
                        React.createElement('div', { className: 'absolute bottom-32 right-1/3 w-8 h-8 bg-green-300 rounded-full animate-pulse' })
                    ),
                    // Main hero content
                    React.createElement('div', { className: 'relative z-10' },
                        React.createElement('div', { className: 'flex justify-center items-center mb-6' },
                            React.createElement('div', { className: 'text-8xl mr-4 animate-bounce' }, '🤖'),
                            React.createElement('div', { className: 'text-6xl animate-pulse' }, '✨')
                        ),
                        React.createElement('h1', { className: 'text-6xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 mb-6 animate-pulse' }, 'InterviewAI'),
                        React.createElement('div', { className: 'text-2xl md:text-3xl font-bold text-white mb-4' }, 'The Future of Hiring is Here'),
                        React.createElement('p', { className: 'text-lg md:text-xl text-gray-200 mb-8 max-w-3xl mx-auto leading-relaxed' }, 
                            'Experience next-generation AI-powered interviews with advanced proctoring, real-time analysis, and intelligent candidate assessment'
                        ),
                        React.createElement('div', { className: 'flex flex-wrap justify-center gap-4 mb-8' },
                            React.createElement('div', { className: 'bg-white bg-opacity-20 backdrop-blur-sm rounded-full px-6 py-3 text-white font-semibold flex items-center' },
                                React.createElement('span', { className: 'mr-2' }, '🎯'),
                                'Smart Proctoring'
                            ),
                            React.createElement('div', { className: 'bg-white bg-opacity-20 backdrop-blur-sm rounded-full px-6 py-3 text-white font-semibold flex items-center' },
                                React.createElement('span', { className: 'mr-2' }, '🧠'),
                                'AI Analysis'
                            ),
                            React.createElement('div', { className: 'bg-white bg-opacity-20 backdrop-blur-sm rounded-full px-6 py-3 text-white font-semibold flex items-center' },
                                React.createElement('span', { className: 'mr-2' }, '📊'),
                                'Real-time Insights'
                            )
                        )
                    )
                ),


                // Interactive Feature Showcase
                React.createElement('div', { className: 'mb-16' },
                    React.createElement('div', { className: 'text-center mb-12' },
                        React.createElement('h2', { className: 'text-4xl font-bold text-white mb-4' }, 'Powerful Features at Your Fingertips'),
                        React.createElement('p', { className: 'text-xl text-gray-300' }, 'Everything you need for modern, intelligent hiring')
                    ),
                    
                    // Feature Cards Grid
                    React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8' },
                        userRole === 'candidate' && React.createElement('div', { className: 'group relative' },
                            React.createElement('div', { className: 'absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-300' }),
                            React.createElement('div', { className: 'relative bg-white rounded-2xl p-8 text-center transform group-hover:scale-105 transition-all duration-300 shadow-xl' },
                                React.createElement('div', { className: 'w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-3xl text-white mx-auto mb-6 group-hover:rotate-12 transition-transform duration-300' }, '📄'),
                                React.createElement('h3', { className: 'text-2xl font-bold mb-4 text-gray-800' }, 'Smart Resume Analysis'),
                                React.createElement('p', { className: 'text-gray-600 mb-6 leading-relaxed' }, 'AI-powered ATS compatibility checking with detailed optimization suggestions and keyword analysis'),
                                React.createElement('div', { className: 'flex justify-center items-center mb-6' },
                                    React.createElement('div', { className: 'flex space-x-2' },
                                        React.createElement('span', { className: 'w-2 h-2 bg-blue-500 rounded-full animate-bounce' }),
                                        React.createElement('span', { className: 'w-2 h-2 bg-purple-500 rounded-full animate-bounce', style: { animationDelay: '0.1s' } }),
                                        React.createElement('span', { className: 'w-2 h-2 bg-pink-500 rounded-full animate-bounce', style: { animationDelay: '0.2s' } })
                                    )
                                ),
                                React.createElement('button', {
                                    className: 'bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-full hover:from-blue-700 hover:to-purple-700 transition-all duration-300 font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1',
                                    onClick: () => {
                                        addNotification('🚀 Resume analysis feature loaded!', 'success');
                                        setCurrentPage('ats');
                                    }
                                }, '✨ Start Analysis')
                            )
                        ),
                        
                        userRole === 'candidate' && React.createElement('div', { className: 'group relative' },
                            React.createElement('div', { className: 'absolute inset-0 bg-gradient-to-r from-green-600 to-teal-600 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-300' }),
                            React.createElement('div', { className: 'relative bg-white rounded-2xl p-8 text-center transform group-hover:scale-105 transition-all duration-300 shadow-xl' },
                                React.createElement('div', { className: 'w-16 h-16 bg-gradient-to-r from-green-500 to-teal-500 rounded-full flex items-center justify-center text-3xl text-white mx-auto mb-6 group-hover:rotate-12 transition-transform duration-300' }, '💻'),
                                React.createElement('h3', { className: 'text-2xl font-bold mb-4 text-gray-800' }, 'Technical Mastery'),
                                React.createElement('p', { className: 'text-gray-600 mb-6 leading-relaxed' }, 'Comprehensive coding challenges with real-time evaluation and intelligent difficulty adaptation'),
                                React.createElement('div', { className: 'flex justify-center items-center mb-6' },
                                    React.createElement('div', { className: 'bg-gray-100 rounded-full px-4 py-2 text-sm font-semibold text-gray-700' },
                                        React.createElement('span', { className: 'text-green-500 mr-1' }, '●'),
                                        'Multi-language Support'
                                    )
                                ),
                                React.createElement('button', {
                                    className: 'bg-gradient-to-r from-green-600 to-teal-600 text-white px-8 py-3 rounded-full hover:from-green-700 hover:to-teal-700 transition-all duration-300 font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1',
                                    onClick: () => {
                                        addNotification('🎯 Technical test ready!', 'success');
                                        setCurrentPage('technical');
                                    }
                                }, '🚀 Take Challenge')
                            )
                        ),

        function AnalysisPage({ addNotification, setCurrentPage }) {
            const [performanceData, setPerformanceData] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);

            React.useEffect(() => {
                const userData = localStorage.getItem('interviewai_user');
                if (userData) {
                    const user = JSON.parse(userData);
                    setCurrentUser(user);
                    loadPerformanceData(user);
                }
            }, []);

            const loadPerformanceData = (user) => {
                try {
                    // Get user's assessment data from the correct storage keys
                    const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                    const userRecord = registeredUsers.find(u => u.email === user.email);
                    
                    if (!userRecord) {
                        setLoading(false);
                        return;
                    }

                    // Get ATS results
                    const atsResults = JSON.parse(localStorage.getItem('ats_results') || '{}');
                    const userAtsResults = atsResults[userRecord.id];

                    // Get Technical results (aptitude + coding)
                    const technicalResults = JSON.parse(localStorage.getItem('technical_results') || '{}');
                    const userTechnicalResults = technicalResults[userRecord.id];

                    // Get Interview results from ai_interview_results
                    const aiInterviewResults = JSON.parse(localStorage.getItem('ai_interview_results') || '{}');
                    const userInterviewResults = aiInterviewResults[userRecord.id];
                    
                    // Get user feedback
                    const userFeedback = JSON.parse(localStorage.getItem('user_feedback') || '[]');
                    
                    // Process ATS data
                    const atsData = userAtsResults ? {
                        completed: userAtsResults.completed || false,
                        score: userAtsResults.score || 0,
                        details: userAtsResults.analysis || {},
                        completedAt: userAtsResults.completedAt,
                        sections: {
                            formatting: userAtsResults.analysis?.formatting || 0,
                            keywords: userAtsResults.analysis?.keywords || 0,
                            experience: userAtsResults.analysis?.experience || 0,
                            education: userAtsResults.analysis?.education || 0,
                            skills: userAtsResults.analysis?.skills || 0
                        }
                    } : { completed: false, score: 0, sections: {} };

                    // Process Technical data (aptitude + coding)
                    const technicalData = userTechnicalResults ? {
                        completed: (userTechnicalResults.aptitude && userTechnicalResults.coding) ? true : false,
                        aptitude: {
                            completed: userTechnicalResults.aptitude ? true : false,
                            score: userTechnicalResults.aptitude?.aptitudeScore || 0,
                            correctAnswers: userTechnicalResults.aptitude?.correctAnswers || 0,
                            totalQuestions: userTechnicalResults.aptitude?.totalQuestions || 10,
                            timeSpent: userTechnicalResults.aptitude?.timeSpent || 0,
                            completedAt: userTechnicalResults.aptitude?.completedAt
                        },
                        coding: {
                            completed: userTechnicalResults.coding ? true : false,
                            score: userTechnicalResults.coding?.codingScore || 0,
                            problems: userTechnicalResults.coding?.problems || [],
                            timeSpent: userTechnicalResults.coding?.timeSpent || 0,
                            completedAt: userTechnicalResults.coding?.completedAt
                        },
                        overallScore: userTechnicalResults.overall?.overallScore || 
                                     (userTechnicalResults.aptitude && userTechnicalResults.coding ? 
                                      Math.round(((userTechnicalResults.aptitude.aptitudeScore || 0) + (userTechnicalResults.coding.codingScore || 0)) / 2) : 0),
                        completedAt: userTechnicalResults.overall?.completedAt
                    } : { 
                        completed: false, 
                        aptitude: { completed: false, score: 0 }, 
                        coding: { completed: false, score: 0 }, 
                        overallScore: 0 
                    };

                    // Process Interview data
                    const interviewData = userInterviewResults ? {
                        completed: userInterviewResults.completed || false,
                        score: userInterviewResults.overallScore || 0,
                        responses: userInterviewResults.responses || [],
                        questionsAnswered: userInterviewResults.responses?.length || 0,
                        averageResponseLength: userInterviewResults.responses?.length > 0 ? 
                            Math.round(userInterviewResults.responses.reduce((acc, r) => acc + (r.answer?.length || 0), 0) / userInterviewResults.responses.length) : 0,
                        completedAt: userInterviewResults.completedAt,
                        interviewDuration: userInterviewResults.interviewDuration || 0,
                        proctoringViolations: userInterviewResults.proctoringViolations || 0,
                        behaviorAnalysis: userInterviewResults.behaviorAnalysis || {},
                        totalQuestions: userInterviewResults.totalQuestions || 0
                    } : { completed: false, score: 0, responses: [], questionsAnswered: 0, averageResponseLength: 0, interviewDuration: 0, proctoringViolations: 0, totalQuestions: 0 };

                    // Calculate overall performance
                    const data = {
                        ats: atsData,
                        technical: technicalData,
                        interview: interviewData,
                        feedback: userFeedback.filter(f => f.userEmail === user.email)
                    };
                    
                    // Calculate overall progress and score
                    const completedSections = [data.ats.completed, data.technical.completed, data.interview.completed].filter(Boolean).length;
                    data.overallProgress = (completedSections / 3) * 100;
                    
                    // Calculate weighted overall score: Resume 30% + Technical 40% + Interview 30%
                    const atsWeight = 0.3;
                    const technicalWeight = 0.4;
                    const interviewWeight = 0.3;
                    
                    data.overallScore = (
                        (data.ats.score * atsWeight) + 
                        (data.technical.overallScore * technicalWeight) + 
                        (data.interview.score * interviewWeight)
                    ).toFixed(1);
                    
                    setPerformanceData(data);
                    setLoading(false);
                    addNotification('Performance analysis loaded successfully', 'success');
                } catch (error) {
                    console.error('Error loading performance data:', error);
                    setLoading(false);
                    addNotification('Error loading performance data', 'error');
                }
            };

            const getScoreColor = (score) => {
                if (score >= 80) return 'text-green-600';
                if (score >= 60) return 'text-yellow-600';
                return 'text-red-600';
            };

            const getScoreBgColor = (score) => {
                if (score >= 80) return 'bg-green-100 border-green-200';
                if (score >= 60) return 'bg-yellow-100 border-yellow-200';

            const renderScoreChart = (score, label, icon) => {
                const circumference = 2 * Math.PI * 45;
                const strokeDasharray = circumference;
                const strokeDashoffset = circumference - (score / 100) * circumference;
                
                return React.createElement('div', { className: 'flex flex-col items-center' },
                    React.createElement('div', { className: 'relative w-24 h-24 mb-2' },
                        React.createElement('svg', { className: 'w-24 h-24 transform -rotate-90' },
                            React.createElement('circle', {

                                r: '45',
                                stroke: '#e5e7eb',

                                fill: 'transparent'
                            }),
                            React.createElement('circle', {
                                cx: '48',
                                cy: '48',
                                r: '45',
                                stroke: score >= 80 ? '#10b981' : score >= 60 ? '#f59e0b' : '#ef4444',
                                strokeWidth: '6',
                                fill: 'transparent',
                                strokeDasharray: strokeDasharray,
                                strokeDashoffset: strokeDashoffset,
                                strokeLinecap: 'round'
                            })
                        ),
                        React.createElement('div', { className: 'absolute inset-0 flex items-center justify-center' },
                            React.createElement('span', { className: `text-lg font-bold ${getScoreColor(score)}` }, `${score}%`)
                        )
                    ),
                    React.createElement('div', { className: 'text-center' },
                        React.createElement('div', { className: 'text-2xl mb-1' }, icon),

                    )
                );

        function DashboardPage({ addNotification, setCurrentPage }) {
            const [candidates, setCandidates] = useState([]);
            const [scheduledInterviews, setScheduledInterviews] = useState([]);
            const [showScheduleModal, setShowScheduleModal] = useState(false);
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [reschedulingInterview, setReschedulingInterview] = useState(null);
            const [interviewForm, setInterviewForm] = useState({
                date: '',
                time: '',
                duration: '60',
                type: 'technical',
                notes: ''
            });

            // Load candidates and scheduled interviews on component mount
            React.useEffect(() => {
                const users = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                const candidateUsers = users.filter(user => user.role === 'candidate');
                
                // Get real test results to determine interview eligibility
                const atsResults = JSON.parse(localStorage.getItem('ats_results') || '{}');
                const technicalResults = JSON.parse(localStorage.getItem('technical_results') || '{}');
                
                // Filter candidates to only include those eligible for interviews
                const eligibleCandidates = candidateUsers.filter(candidate => {
                    const candidateAtsResults = atsResults[candidate.id];
                    const candidateTechnicalResults = technicalResults[candidate.id];
                    
                    // Check if both assessments are completed
                    const resumeCompleted = candidateAtsResults?.completed || false;
                    const technicalCompleted = candidateTechnicalResults?.overall?.completed || false;
                    
                    if (!resumeCompleted || !technicalCompleted) {
                        return false; // Not eligible if assessments not completed
                    }
                    
                    // Calculate overall score
                    let overallScore = 0;
                    if (candidateTechnicalResults?.overall?.overallScore) {
                        overallScore = candidateTechnicalResults.overall.overallScore;
                    } else {
                        // Calculate: Resume 30% + Aptitude 35% + Coding 35%
                        const resumeScore = candidateAtsResults.score || 0;
                        const aptitudeScore = candidateTechnicalResults.aptitude?.aptitudeScore || 0;
                        const codingScore = candidateTechnicalResults.coding?.codingScore || 0;
                        
                        overallScore = Math.round(
                            (resumeScore * 0.3) + 
                            (aptitudeScore * 0.35) + 
                            (codingScore * 0.35)
                        );
                    }
                    
                    // Only include candidates with 80%+ overall score
                    return overallScore >= 70;
                });
                
                setCandidates(eligibleCandidates);

                const interviews = JSON.parse(localStorage.getItem('scheduled_interviews') || '[]');
                setScheduledInterviews(interviews);
                
                // Check if we came from analytics with a candidate to schedule
                const candidateToSchedule = localStorage.getItem('candidate_to_schedule');
                if (candidateToSchedule) {
                    try {
                        const candidate = JSON.parse(candidateToSchedule);
                        // Find the full candidate record
                        const fullCandidate = eligibleCandidates.find(c => c.id === candidate.id);
                        if (fullCandidate) {
                            setSelectedCandidate(fullCandidate);
                            setShowScheduleModal(true);
                            addNotification(`Ready to schedule interview for ${candidate.name} (${candidate.overallScore}% overall score)`, 'success');
                        }
                        // Clear the stored candidate data
                        localStorage.removeItem('candidate_to_schedule');
                    } catch (error) {
                        console.error('Error parsing candidate to schedule:', error);
                        localStorage.removeItem('candidate_to_schedule');
                    }
                }
            }, []);

            const scheduleInterview = () => {
                if (!selectedCandidate || !interviewForm.date || !interviewForm.time) {
                    addNotification('Please fill in all required fields', 'error');
                    return;
                }

                if (reschedulingInterview) {
                    // Rescheduling existing interview
                    const updatedInterviews = scheduledInterviews.map(i => 
                        i.id === reschedulingInterview.id ? {
                            ...i,
                            date: interviewForm.date,
                            time: interviewForm.time,
                            duration: parseInt(interviewForm.duration),
                            type: interviewForm.type,
                            notes: interviewForm.notes,
                            rescheduledAt: new Date().toISOString(),
                            rescheduledBy: JSON.parse(localStorage.getItem('interviewai_user') || '{}').name || 'HR Manager'
                        } : i
                    );
                    setScheduledInterviews(updatedInterviews);
                    localStorage.setItem('scheduled_interviews', JSON.stringify(updatedInterviews));

                    // Add rescheduled notification for candidate
                    const candidateNotifications = JSON.parse(localStorage.getItem(`candidate_notifications_${selectedCandidate.id}`) || '[]');
                    const notification = {
                        id: Date.now(),
                        type: 'interview_rescheduled',
                        title: 'Interview Rescheduled',
                        message: `Your ${interviewForm.type} interview has been rescheduled to ${interviewForm.date} at ${interviewForm.time}`,
                        date: interviewForm.date,
                        time: interviewForm.time,
                        duration: interviewForm.duration,
                        interviewType: interviewForm.type,
                        notes: interviewForm.notes,
                        timestamp: new Date().toISOString(),
                        read: false
                    };
                    candidateNotifications.push(notification);
                    localStorage.setItem(`candidate_notifications_${selectedCandidate.id}`, JSON.stringify(candidateNotifications));

                    addNotification(`Interview rescheduled successfully for ${selectedCandidate.name}!`, 'success');
                } else {
                    // Scheduling new interview
                    const newInterview = {
                        id: Date.now(),
                        candidateId: selectedCandidate.id,
                        candidateName: selectedCandidate.name,
                        candidateEmail: selectedCandidate.email,
                        date: interviewForm.date,
                        time: interviewForm.time,
                        duration: parseInt(interviewForm.duration),
                        type: interviewForm.type,
                        notes: interviewForm.notes,
                        status: 'scheduled',
                        scheduledBy: JSON.parse(localStorage.getItem('interviewai_user') || '{}').name || 'HR Manager',
                        scheduledAt: new Date().toISOString()
                    };

                    const updatedInterviews = [...scheduledInterviews, newInterview];
                    setScheduledInterviews(updatedInterviews);
                    localStorage.setItem('scheduled_interviews', JSON.stringify(updatedInterviews));

                    // Add notification for candidate
                    const candidateNotifications = JSON.parse(localStorage.getItem(`candidate_notifications_${selectedCandidate.id}`) || '[]');
                    const notification = {
                        id: Date.now(),
                        type: 'interview_scheduled',
                        title: 'Interview Scheduled',
                        message: `Your ${interviewForm.type} interview has been scheduled for ${interviewForm.date} at ${interviewForm.time}`,
                        date: interviewForm.date,
                        time: interviewForm.time,
                        duration: interviewForm.duration,
                        interviewType: interviewForm.type,
                        notes: interviewForm.notes,
                        timestamp: new Date().toISOString(),
                        read: false
                    };
                    candidateNotifications.push(notification);

        function ATSPage({ addNotification }) {
            const [uploadedFile, setUploadedFile] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [analysisResult, setAnalysisResult] = useState(null);
            const fileInputRef = useRef(null);
            
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadedFile(file);
                    addNotification(`File "${file.name}" uploaded successfully!`, 'success');
                }
            };
            
            const analyzeResume = async () => {
                if (!uploadedFile) {
                    addNotification('Please upload a file first!', 'error');
                    return;
                }
                try {
                    setAnalyzing(true);
                    addNotification('Analyzing your resume...', 'info');

                    // Call server OpenAI endpoint
                    const resp = await fetch('/api/evaluate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: 'ATS Resume Analysis',
                            transcript: `File: ${uploadedFile.name} (type: ${uploadedFile.type})\nThe resume content is referenced. Evaluate for ATS compatibility and return JSON with: score (0-100), strengths (array), improvements (array).`,
                            rubric: 'Focus on ATS parsing, keyword coverage, measurable achievements, formatting best practices, and clarity. Be concise.'
                        })
                    });
                    const data = await resp.json();
                    if (!resp.ok || !data.ok) {
                        throw new Error(data.error || 'Failed to analyze resume');
                    }
                    const evaluation = data.evaluation || {};
                    const score = typeof evaluation.score === 'number' ? evaluation.score : 0;
                    const strengths = Array.isArray(evaluation.strengths) ? evaluation.strengths : [];
                    const improvements = Array.isArray(evaluation.improvements) ? evaluation.improvements : [];

                    const analysisData = {
                        score,
                        atsCompatibility: score,
                        keywordMatch: score,
                        formatScore: score,
                        strengths,
                        improvements
                    };
                    setAnalysisResult(analysisData);

                    // Store ATS results for current user
                    const currentUser = JSON.parse(localStorage.getItem('interviewai_user') || '{}');
                    if (currentUser.email) {
                        const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                        const userRecord = registeredUsers.find(u => u.email === currentUser.email);
                        if (userRecord) {
                            const atsResults = {
                                userId: userRecord.id,
                                completed: true,
                                score,
                                atsCompatibility: analysisData.atsCompatibility,
                                keywordMatch: analysisData.keywordMatch,
                                formatScore: analysisData.formatScore,
                                completedAt: new Date().toISOString(),
                                fileName: uploadedFile.name
                            };
                            const existingResults = JSON.parse(localStorage.getItem('ats_results') || '{}');
                            existingResults[userRecord.id] = atsResults;
                            localStorage.setItem('ats_results', JSON.stringify(existingResults));
                            addNotification('ATS analysis complete and saved!', 'success');
                        }
                    }
                } catch (e) {
                    console.error('ATS analysis failed:', e);
                    addNotification(`ATS analysis failed: ${e.message || e}`, 'error');
                } finally {
                    setAnalyzing(false);
                }
            };
            
            return React.createElement('div', { className: 'max-w-4xl mx-auto' },
                React.createElement('h2', { className: 'text-4xl font-bold text-white mb-8' }, 'ATS Resume Checker'),
                React.createElement('div', { className: 'card p-8' },
                    React.createElement('div', { className: 'text-center mb-8' },

                        React.createElement('h3', { className: 'text-2xl font-bold mb-4' }, 'Upload Your Resume'),

                        React.createElement('input', {
                            ref: fileInputRef,
                            type: 'file',
                            accept: '.pdf,.doc,.docx,.txt',
                            onChange: handleFileUpload,
                            style: { display: 'none' }

                        React.createElement('button', {
                            className: 'bg-blue-600 text-white px-8 py-4 rounded-lg hover:bg-blue-700 transition-colors mb-4',
                            onClick: () => fileInputRef.current?.click()

            // Generate AI Interview Questions
            const generateAIQuestions = () => {
                const categories = ['behavioral', 'technical', 'problemSolving'];

                // Always include at least one behavioral question
                const behavioralQuestions = questionPool.behavioral;
                questions.push({

                    category: 'behavioral',

                    difficulty: 'medium'
                });
                
                // Add 2-3 technical questions
                const technicalQuestions = questionPool.technical;
                for (let i = 0; i < 2; i++) {
                    const randomTech = technicalQuestions[Math.floor(Math.random() * technicalQuestions.length)];
                    if (!questions.find(q => q.question === randomTech)) {
                        questions.push({
                            id: questions.length + 1,
                            category: 'technical',
                            question: randomTech,
                            timeLimit: 240, // 4 minutes
                            difficulty: 'hard'
                        });
                    }
                }
                
                // Add 1-2 problem-solving questions
                const problemQuestions = questionPool.problemSolving;
                for (let i = 0; i < 2; i++) {
                    const randomProblem = problemQuestions[Math.floor(Math.random() * problemQuestions.length)];
                    if (!questions.find(q => q.question === randomProblem)) {
                        questions.push({
                            id: questions.length + 1,
                            category: 'problemSolving',
                            question: randomProblem,
                            timeLimit: 300, // 5 minutes
                            difficulty: 'hard'
                        });
                    }
                }
                
                return questions.slice(0, 5); // Ensure exactly 5 questions
            };

            // Initialize Speech Recognition
            React.useEffect(() => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';
                    
                    recognition.onstart = () => {
                        setIsListening(true);
                        addNotification('🎤 Listening... Speak your answer clearly', 'info');
                    };
                    
                    recognition.onresult = (event) => {
                        let interimTranscript = '';
                        let finalTranscriptText = '';
                        
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                finalTranscriptText += transcript;
                            } else {
                                interimTranscript += transcript;
                            }
                        }
                        
                        setCurrentTranscript(interimTranscript);
                        if (finalTranscriptText) {
                            setFinalTranscript(prev => prev + finalTranscriptText);
                        }
                    };
                    
                    recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                        setIsListening(false);
                        addNotification('Speech recognition error. Please try again.', 'error');
                    };
                    
                    recognition.onend = () => {
                        setIsListening(false);
                    };
                    
                    setSpeechRecognition(recognition);
                    setSpeechSupported(true);
                } else {
                    setSpeechSupported(false);
                    addNotification('Speech recognition not supported in this browser', 'warning');
                }
            }, []);

            // Text-to-Speech function
            const speakQuestion = (questionText) => {
                if ('speechSynthesis' in window) {
                    // Stop any ongoing speech
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(questionText);
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    utterance.volume = 0.8;
                    
                    utterance.onstart = () => {
                        setIsSpeaking(true);
                        addNotification('🔊 AI is asking the question...', 'info');
                    };
                    
                    utterance.onend = () => {
                        setIsSpeaking(false);
                        addNotification('Question completed. You may start answering.', 'success');
                    };
                    
                    utterance.onerror = (event) => {
                        setIsSpeaking(false);
                        console.error('Speech synthesis error:', event.error);
                    };
                    
                    window.speechSynthesis.speak(utterance);
                } else {
                    addNotification('Text-to-speech not supported in this browser', 'warning');
                }
            };

            // Start Speech Recognition
            const startSpeechRecognition = () => {
                if (speechRecognition && speechSupported) {
                    setCurrentTranscript('');
                    setFinalTranscript('');
                    speechRecognition.start();
                }
            };

            // Stop Speech Recognition
            const stopSpeechRecognition = () => {
                if (speechRecognition && isListening) {
                    speechRecognition.stop();
                }
            };

            // Submit Feedback Function
            const submitFeedback = () => {
                if (feedbackRating === 0) {
                    addNotification('Please select a rating before submitting feedback', 'warning');
                    return;
                }
                
                const currentUser = JSON.parse(localStorage.getItem('interviewai_user') || '{}');
                const feedback = {
                    userId: currentUser.id || Date.now(),
                    userEmail: currentUser.email,
                    rating: feedbackRating,
                    comment: feedbackComment.trim(),
                    submittedAt: new Date().toISOString(),
                    interviewType: 'AI Interview',
                    platform: 'Interview AI Platform'
                };
                
                // Save feedback to localStorage
                const existingFeedback = JSON.parse(localStorage.getItem('user_feedback') || '[]');
                existingFeedback.push(feedback);
                localStorage.setItem('user_feedback', JSON.stringify(existingFeedback));
                
                setFeedbackSubmitted(true);
                addNotification('Thank you for your feedback! Your experience rating has been submitted.', 'success');
            };

            // Evaluate Answer Accuracy using AI-like scoring
            const evaluateAnswerAccuracy = (question, answer, category) => {
                setIsEvaluating(true);
                
                // Simulate AI evaluation with realistic scoring
                setTimeout(() => {
                    let score = 0;
                    let feedback = '';
                    
                    // Basic scoring algorithm
                    const answerLength = answer.trim().length;
                    const wordCount = answer.trim().split(/\s+/).length;
                    
                    // Length and content scoring
                    if (answerLength < 50) {
                        score = Math.max(20, Math.random() * 40);
                        feedback = 'Answer too brief. Provide more detailed examples and explanations.';
                    } else if (answerLength < 200) {
                        score = 40 + Math.random() * 30;
                        feedback = 'Good start. Consider adding more specific examples and details.';
                    } else if (answerLength < 500) {
                        score = 60 + Math.random() * 25;
                        feedback = 'Well-structured answer. Good use of examples and explanations.';
                    } else {
                        score = 75 + Math.random() * 20;
                        feedback = 'Comprehensive and detailed response. Excellent communication skills.';
                    }
                    
                    // Category-specific adjustments
                    if (category === 'technical') {
                        if (answer.toLowerCase().includes('algorithm') || 
                            answer.toLowerCase().includes('data structure') ||
                            answer.toLowerCase().includes('complexity')) {
                            score += 10;
                            feedback += ' Good technical terminology usage.';
                        }
                    } else if (category === 'behavioral') {
                        if (answer.toLowerCase().includes('situation') || 
                            answer.toLowerCase().includes('challenge') ||
                            answer.toLowerCase().includes('result')) {
                            score += 10;
                            feedback += ' Good use of STAR method structure.';
                        }
                    } else if (category === 'problemSolving') {
                        if (answer.toLowerCase().includes('approach') || 
                            answer.toLowerCase().includes('solution') ||
                            answer.toLowerCase().includes('step')) {
                            score += 10;
                            feedback += ' Clear problem-solving methodology demonstrated.';
                        }
                    }
                    
                    // Ensure score is within bounds
                    score = Math.min(95, Math.max(15, Math.round(score)));
                    
                    const accuracy = {
                        score: score,
                        feedback: feedback,
                        wordCount: wordCount,
                        category: category
                    };
                    
                    setAnswerAccuracy(accuracy);
                    setIsEvaluating(false);
                    
                    addNotification(`Answer evaluated: ${score}% accuracy`, score >= 70 ? 'success' : 'warning');
                }, 2000); // Simulate processing time
            };

            // Get user role and information
            React.useEffect(() => {
                const userData = localStorage.getItem('interviewai_user');
                const interviewContext = JSON.parse(localStorage.getItem('current_interview_context') || '{}');
                
                // Check technical test qualification for candidates
                if (userData) {
                    const user = JSON.parse(userData);
                    if (user.role === 'candidate') {
                        const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                        const userRecord = registeredUsers.find(u => u.email === user.email);

            // Monitor HR presence for candidates
            React.useEffect(() => {

                            setHrJoinedTime(roomStatus.hrJoinedTime);
                            setShowHrJoinedMessage(true);

                            const hrName = roomStatus.hrName || 'HR Manager';
                            const joinMessage = {

                    // Check immediately and then every 2 seconds
                    checkHrPresence();
                    const interval = setInterval(checkHrPresence, 2000);
                    
                    return () => clearInterval(interval);
                }
            }, [userRole, interviewState, hrPresent]);
            
            
            React.useEffect(() => {
                if (interviewState === 'active' && timeLeft > 0) {
                    const timer = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                    return () => clearTimeout(timer);
                } else if (timeLeft === 0) {
                    endInterview();
                }
            }, [interviewState, timeLeft]);
            
            // Proctoring system initialization
            React.useEffect(() => {
                if (proctoringEnabled && interviewState === 'active') {
                    // Start proctoring monitoring
                    const eyeTrackingInterval = setInterval(simulateEyeTracking, 2000);
                    const objectDetectionInterval = setInterval(simulateObjectDetection, 3000);
                    const peopleDetectionInterval = setInterval(simulatePeopleDetection, 4000);
                    
                    // Add event listeners
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                    document.addEventListener('keydown', handleKeyDown);
                    
                    return () => {
                        clearInterval(eyeTrackingInterval);
                        clearInterval(objectDetectionInterval);
                        clearInterval(peopleDetectionInterval);
                        document.removeEventListener('visibilitychange', handleVisibilityChange);
                        document.removeEventListener('keydown', handleKeyDown);
                    };
                }
            }, [proctoringEnabled, interviewState]);
            
            // AI Behavior Analysis initialization
            React.useEffect(() => {
                if (proctoringEnabled && interviewState === 'active') {
                    // Start AI behavior analysis
                    const behaviorAnalysisInterval = setInterval(analyzeBehaviorPatterns, 5000);
                    const bodyLanguageInterval = setInterval(analyzeBodyLanguage, 3000);
                    const voiceAnalysisInterval = setInterval(analyzeVoicePatterns, 4000);
                    const suspiciousBehaviorInterval = setInterval(detectSuspiciousBehavior, 6000);
                    const riskAssessmentInterval = setInterval(calculateOverallRiskAssessment, 8000);
                    
                    return () => {
                        clearInterval(behaviorAnalysisInterval);
                        clearInterval(bodyLanguageInterval);
                        clearInterval(voiceAnalysisInterval);
                        clearInterval(suspiciousBehaviorInterval);
                        clearInterval(riskAssessmentInterval);
                    };
                }
            }, [proctoringEnabled, interviewState]);
            
            // Proctoring status notification
            React.useEffect(() => {
                if (interviewState === 'active' && proctoringEnabled) {
                    addNotification('🔒 Proctoring system activated - Interview is being monitored', 'info');
                }
            }, [interviewState, proctoringEnabled]);
            
            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };
            
            const startInterview = async () => {
                try {
                    // Ensure media is properly initialized before starting interview
                    if (!mediaStream || !cameraEnabled || !micEnabled) {
                        addNotification('Initializing camera and microphone for interview...', 'info');
                        await initializeMedia();
                        
                        // Wait a moment for initialization
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                    
                    // Double-check that we have active media stream
                    if (!mediaStream) {
                        throw new Error('Failed to initialize media stream');
                    }
                    
                    // Ensure camera and mic are enabled
                    const videoTracks = mediaStream.getVideoTracks();
                    const audioTracks = mediaStream.getAudioTracks();
                    
                    if (videoTracks.length > 0) {
                        videoTracks[0].enabled = true;
                        setCameraEnabled(true);
                    }
                    
                    if (audioTracks.length > 0) {
                        audioTracks[0].enabled = true;
                        setMicEnabled(true);
                    }
                    
                    // Set up video element for interview
                    if (videoRef.current && mediaStream) {
                        videoRef.current.srcObject = mediaStream;
                        await videoRef.current.play();
                    }
                    
                    // Generate AI Interview Questions
                    const questions = generateAIQuestions();
                    setAiQuestions(questions);
                    setCurrentQuestionIndex(0);
                    setQuestionStartTime(Date.now());
                    
                    // Automatically speak the first question
                    setTimeout(() => {
                        if (questions.length > 0) {
                            speakQuestion(questions[0].question);
                        }
                    }, 1000);
                    
                    // Notify candidate that HR has started the interview
                    const currentUser = JSON.parse(localStorage.getItem('interviewai_user') || '{}');
                    const interviewContext = JSON.parse(localStorage.getItem('current_interview_context') || '{}');
                    
                    if (currentUser.role === 'hr' && interviewContext.candidateId) {
                        // Get HR name
                        const hrName = currentUser.name || 'HR Manager';
