            const setupAudioAnalysis = (stream) => {
                try {
                    console.log('Setting up audio analysis for stream:', stream);
                    
                    // Clean up previous audio context
                    if (audioContextRef.current) {
                        audioContextRef.current.close();
                    }
                    
                    // Create new audio context
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('Audio context state:', audioContext.state);
                    
                    // Resume audio context if suspended (required by modern browsers)
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => {
                            console.log('Audio context resumed');
                        });
                    }
                    
                    const analyser = audioContext.createAnalyser();
                    const microphone = audioContext.createMediaStreamSource(stream);
                    
                    // More sensitive settings
                    analyser.fftSize = 2048;
                    analyser.smoothingTimeConstant = 0.3;
                    analyser.minDecibels = -90;
                    analyser.maxDecibels = -10;
                    
                    microphone.connect(analyser);
                    
                    audioContextRef.current = audioContext;
                    analyserRef.current = analyser;
                    
                    console.log('Audio analysis setup complete:', {
                        fftSize: analyser.fftSize,
                        frequencyBinCount: analyser.frequencyBinCount,
                        sampleRate: audioContext.sampleRate
                    });
                    
                    // Start audio level monitoring
                    monitorAudioLevel();
                    
                    // Simple test - log if we're getting any data
                    setTimeout(() => {
                        if (analyserRef.current) {
                            const testArray = new Uint8Array(analyserRef.current.frequencyBinCount);
                            analyserRef.current.getByteFrequencyData(testArray);
                            const sum = testArray.reduce((a, b) => a + b, 0);
                            console.log('Audio data test - sum:', sum, 'average:', sum / testArray.length);
                        }
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error setting up audio analysis:', error);
                    addNotification('Audio monitoring setup failed: ' + error.message, 'error');
                }
            };
            
            const monitorAudioLevel = () => {
                if (!analyserRef.current) {
                    console.log('No analyser available for audio monitoring');
                    // Fallback: simple audio track monitoring
                    startFallbackAudioMonitoring();
                    return;
                }
                
                const bufferLength = analyserRef.current.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const freqDataArray = new Uint8Array(bufferLength);
                
                const updateLevel = () => {
                    if (analyserRef.current && micEnabled && mediaStream) {
                        // Check if audio tracks are active
                        const audioTracks = mediaStream.getAudioTracks();
                        if (audioTracks.length === 0) {
                            console.log('No audio tracks available');
                            setAudioLevel(0);
                            requestAnimationFrame(updateLevel);
                            return;
                        }
                        
                        const audioTrack = audioTracks[0];
                        if (!audioTrack.enabled) {
                            console.log('Audio track is disabled');
                            setAudioLevel(0);
                            requestAnimationFrame(updateLevel);
                            return;
                        }
                        
                        try {
                            // Use both time domain and frequency data for better detection
                            analyserRef.current.getByteTimeDomainData(dataArray);
                            analyserRef.current.getByteFrequencyData(freqDataArray);
                            
                            // Method 1: Time domain RMS calculation
                            let rmsSum = 0;
                            for (let i = 0; i < bufferLength; i++) {
                                const sample = (dataArray[i] - 128) / 128;
                                rmsSum += sample * sample;
                            }
                            const rms = Math.sqrt(rmsSum / bufferLength);
                            
                            // Method 2: Frequency domain average
                            let freqSum = 0;
                            for (let i = 0; i < bufferLength; i++) {
                                freqSum += freqDataArray[i];
                            }
                            const freqAvg = freqSum / bufferLength;
                            
                            // Method 3: Peak detection
                            let peak = 0;
                            for (let i = 0; i < bufferLength; i++) {
                                const sample = Math.abs(dataArray[i] - 128);
                                if (sample > peak) peak = sample;
                            }
                            
                            // Combine methods for more reliable detection
                            const rmsLevel = rms * 100 * 10; // Even higher amplification
                            const freqLevel = (freqAvg / 128) * 100 * 2;
                            const peakLevel = (peak / 128) * 100 * 2;
                            
                            // Use the highest detected level
                            const level = Math.min(100, Math.max(rmsLevel, freqLevel, peakLevel));
                            
                            setAudioLevel(level);
                            
                            // Enhanced debug logging
                            if (level > 1) {
                                console.log(`Audio detected - RMS: ${rmsLevel.toFixed(1)}, Freq: ${freqLevel.toFixed(1)}, Peak: ${peakLevel.toFixed(1)}, Final: ${level.toFixed(1)}`);
                            }
                            
                        } catch (error) {
                            console.error('Error in audio analysis:', error);
                            setAudioLevel(0);
                        }
                        
                        // Test audio track status
                        if (Date.now() % 5000 < 50) { // Log every 5 seconds
                            console.log('Audio track status:', {
                                enabled: audioTrack.enabled,
                                readyState: audioTrack.readyState,
                                muted: audioTrack.muted,
                                settings: audioTrack.getSettings()
                            });
                        }
                    } else {
                        setAudioLevel(0);
                    }
                    requestAnimationFrame(updateLevel);
                };
                
                console.log('Starting enhanced audio level monitoring');
                updateLevel();
            };

            // Advanced People detection with sophisticated tracking
            const simulatePeopleDetection = () => {

                // More sophisticated scenario simulation
                const scenario = Math.random();
                const timeSinceLastDetection = currentTime - currentDetectionStatus.lastDetectionTime;
                
                // Consider previous detection state for continuity
                const previousStatus = currentDetectionStatus.status;
                
                if (scenario < 0.82) {
                    // 82% - Normal: Only candidate detected
                    detectedPeople = 1;

                    confidence = Math.floor(Math.random() * 10) + 90; // 90-99%
                } else if (scenario < 0.87) {

        function AnalyticsPage({ addNotification, setCurrentPage }) {
            const [candidateData, setCandidateData] = useState([]);
            const [filterType, setFilterType] = useState('all');
            const [sortBy, setSortBy] = useState('overall');

            // Load candidate data on component mount
            React.useEffect(() => {
                const registeredUsers = JSON.parse(localStorage.getItem('interviewai_registered_users') || '[]');
                const candidates = registeredUsers.filter(user => user.role === 'candidate');
                
                // Get real test results from localStorage
                const atsResults = JSON.parse(localStorage.getItem('ats_results') || '{}');
                const technicalResults = JSON.parse(localStorage.getItem('technical_results') || '{}');
                
                const candidatesWithData = candidates.map(candidate => {
                    // Get real ATS results for this candidate
                    const candidateAtsResults = atsResults[candidate.id];
                    const candidateTechnicalResults = technicalResults[candidate.id];
                    
                    // Build resume check data from real ATS results
                    const resumeCheck = candidateAtsResults ? {
                        completed: candidateAtsResults.completed,
                        score: candidateAtsResults.score,
                        atsCompatibility: candidateAtsResults.atsCompatibility,
                        keywordMatch: candidateAtsResults.keywordMatch,
                        formatScore: candidateAtsResults.formatScore,
                        completedAt: candidateAtsResults.completedAt,
                        fileName: candidateAtsResults.fileName
                    } : {
                        completed: false,
                        score: 0,
                        atsCompatibility: 0,
                        keywordMatch: 0,
                        formatScore: 0,
                        completedAt: null,
                        fileName: null
                    };
                    
                    // Build technical test data from real results
                    const technicalTest = candidateTechnicalResults ? {
                        completed: candidateTechnicalResults.overall?.completed || false,
                        aptitudeScore: candidateTechnicalResults.aptitude?.aptitudeScore || 0,
                        codingScore: candidateTechnicalResults.coding?.codingScore || 0,
                        timeSpent: (candidateTechnicalResults.aptitude?.timeSpent || 0) + (candidateTechnicalResults.coding?.timeSpent || 0),
                        problemsSolved: candidateTechnicalResults.coding?.problemsSolved || 0,
                        completedAt: candidateTechnicalResults.overall?.submittedAt || null,
                        aptitudeDetails: candidateTechnicalResults.aptitude || null,
                        codingDetails: candidateTechnicalResults.coding || null
                    } : {
                        completed: false,
                        aptitudeScore: 0,
                        codingScore: 0,
                        timeSpent: 0,
                        problemsSolved: 0,
                        completedAt: null,
                        aptitudeDetails: null,
                        codingDetails: null
                    };
                    
                    // Calculate overall score only if both assessments are completed
                    let overallScore = 0;
                    let interviewEligible = false;
                    
                    if (resumeCheck.completed && technicalTest.completed) {
                        // Use the stored overall score if available, otherwise calculate
                        if (candidateTechnicalResults?.overall?.overallScore) {
                            overallScore = candidateTechnicalResults.overall.overallScore;
                        } else {
                            // Calculate: Resume 30% + Aptitude 35% + Coding 35%
                            overallScore = Math.round(
                                (resumeCheck.score * 0.3) + 
                                (technicalTest.aptitudeScore * 0.35) + 
                                (technicalTest.codingScore * 0.35)
                            );
                        }
                        
                        // Check interview eligibility (70%+ threshold)
                        interviewEligible = overallScore >= 70;
                    }
                    
                    // Determine status based on overall score
                    let status = 'Incomplete';
                    if (overallScore > 0) {
                        if (overallScore >= 85) status = 'Excellent';
                        else if (overallScore >= 75) status = 'Good';
                        else if (overallScore >= 65) status = 'Average';
                        else status = 'Below Average';
                    }
                    
                    return {
                        ...candidate,
                        resumeCheck,
                        technicalTest,
                        overallScore,
                        interviewEligible,
                        status
                    };
                });
                
                setCandidateData(candidatesWithData);
                
                const completedBoth = candidatesWithData.filter(c => c.resumeCheck.completed && c.technicalTest.completed).length;
                const eligible = candidatesWithData.filter(c => c.interviewEligible).length;
                
                addNotification(`Loaded analytics: ${candidatesWithData.length} candidates, ${completedBoth} completed both assessments, ${eligible} interview eligible`, 'info');
            }, []);
            // Filter candidates - only show those who completed BOTH assessments
            const filteredCandidates = candidateData.filter(candidate => {
                // Only show candidates who have completed both resume check AND technical test
                return candidate.resumeCheck.completed && candidate.technicalTest.completed;
            }).sort((a, b) => {
                if (sortBy === 'overall') return b.overallScore - a.overallScore;
                if (sortBy === 'resume') return b.resumeCheck.score - a.resumeCheck.score;
                if (sortBy === 'technical') return (b.technicalTest.aptitudeScore + b.technicalTest.codingScore) - (a.technicalTest.aptitudeScore + a.technicalTest.codingScore);
                if (sortBy === 'name') return a.name.localeCompare(b.name);
                return 0;
            });

            const getScoreColor = (score) => {

                                            `${candidate.overallScore}%`
                                        ),
                                        React.createElement('div', { className: 'text-sm mb-2' },
                                            React.createElement('span', { 
                                                className: `px-2 py-1 rounded-full text-xs font-medium ${getStatusBadge(candidate.status)}`
                                            }, candidate.status)
                                        ),
                                        React.createElement('div', { className: 'text-xs text-gray-500 mb-2' },
                                            React.createElement('span', { className: 'mr-2' }, `📄 ${candidate.resumeCheck.score}%`),
                                            React.createElement('span', {}, `💻 ${Math.round((candidate.technicalTest.aptitudeScore + candidate.technicalTest.codingScore) / 2)}%`)
                                        ),
                                        // Schedule Interview button for eligible candidates
                                        candidate.interviewEligible && React.createElement('button', {
                                            className: 'bg-green-600 text-white px-3 py-1 rounded text-xs hover:bg-green-700 transition-colors font-medium',
                                            onClick: (e) => {
                                                e.stopPropagation();
                                                // Store candidate info for pre-filling in dashboard
                                                const candidateForScheduling = {
                                                    id: candidate.id,
                                                    name: candidate.name,
                                                    email: candidate.email,
                                                    company: candidate.company,
                                                    overallScore: candidate.overallScore,
                                                    resumeScore: candidate.resumeCheck.score,
                                                    technicalScore: Math.round((candidate.technicalTest.aptitudeScore + candidate.technicalTest.codingScore) / 2),
                                                    eligibleForInterview: true
                                                };
                                                localStorage.setItem('candidate_to_schedule', JSON.stringify(candidateForScheduling));
                                                addNotification(`Redirecting to schedule interview for ${candidate.name}...`, 'success');
                                                
                                                // Redirect to dashboard after a short delay
                                                setTimeout(() => {
                                                    // Check if we're in the same app or need to navigate
                                                    if (typeof setCurrentPage === 'function') {
                                                        setCurrentPage('dashboard');
                                                    } else {
                                                        // Fallback: reload page with dashboard parameter
                                                        window.location.href = window.location.href.split('?')[0] + '?page=dashboard';
                                                    }
                                                }, 500);
                                            }
                                        }, '📅 Schedule Interview')
                                    )
                                )
                            )
                        ),
                        filteredCandidates.length > 10 && React.createElement('div', { className: 'mt-6 text-center' },
                            React.createElement('p', { className: 'text-gray-600' }, `Showing top 10 of ${filteredCandidates.length} candidates with completed assessments`),
                            React.createElement('button', {
                                className: 'mt-2 text-blue-600 hover:text-blue-800 text-sm',
                                onClick: () => addNotification('Full candidate list feature coming soon!', 'info')
                            }, 'View All Candidates')
                        )
                    )
            );
        }
        
        // Render the application
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
