<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewAI - Login</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 90%;
            padding: 2rem;
        }
        
        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
        }
        
        .brain-icon {
            color: white;
            font-size: 2rem;
        }
        
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .input-field::placeholder {
            color: #9ca3af;
        }
        
        .sign-in-btn {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .sign-in-btn:hover {
            background: #0f172a;
        }
        
        .sign-in-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        
        .divider::before {
            margin-right: 1rem;
        }
        
        .divider::after {
            margin-left: 1rem;
        }
        
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #6b7280;
            font-size: 14px;
        }
        
        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
        }
        
        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LoginPage = () => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');



            // User authentication - will check against registered users
            const getRegisteredUsers = () => {
                const users = localStorage.getItem('interviewai_registered_users');
                return users ? JSON.parse(users) : [];
            };

            const handleEmailLogin = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');
                setIsLoading(true);

                // Basic validation
                if (!email || !password) {
                    setError('Please enter both email and password');
                    setIsLoading(false);
                    return;
                }

                if (!email.includes('@')) {
                    setError('Please enter a valid email address');
                    setIsLoading(false);
                    return;
                }

                // Simulate API call delay
                setTimeout(() => {
                    // Check registered users
                    const registeredUsers = getRegisteredUsers();
                    const user = registeredUsers.find(u => u.email === email && u.password === password);
                    
                    if (user) {
                        setSuccess('Login successful! Redirecting...');
                        
                        // Store login info
                        localStorage.setItem('interviewai_user', JSON.stringify({
                            email: user.email,
                            name: user.name,
                            role: user.role,
                            loginTime: new Date().toISOString()
                        }));

                        // Redirect to main application after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'simple_fixed.html';
                        }, 2000);
                    } else {
                        setError('Invalid email or password. Please check your credentials or sign up for a new account.');
                    }
                    setIsLoading(false);
                }, 1500);
            };

            const handleGoogleLogin = () => {
                setError('');
                
                // Google OAuth configuration
                const googleClientId = '1234567890-abcdefghijklmnopqrstuvwxyz.apps.googleusercontent.com'; // Replace with your actual client ID
                const redirectUri = encodeURIComponent(window.location.origin + '/auth/google/callback');
                const scope = encodeURIComponent('email profile');
                const responseType = 'code';
                const state = encodeURIComponent(Math.random().toString(36).substring(2, 15));
                
                // Store state for security verification
                localStorage.setItem('google_oauth_state', state);
                
                // Construct Google OAuth URL
                const googleAuthUrl = `https://accounts.google.com/oauth/authorize?` +
                    `client_id=${googleClientId}&` +
                    `redirect_uri=${redirectUri}&` +
                    `scope=${scope}&` +
                    `response_type=${responseType}&` +
                    `state=${state}&` +
                    `access_type=offline&` +
                    `prompt=select_account`;
                
                // Redirect to Google OAuth
                window.location.href = googleAuthUrl;
            };


            const handleSignUp = () => {
                // Redirect to registration page
                window.location.href = 'register.html';
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="login-container">
                        {/* Logo */}
                        <div className="logo-circle">
                            <div className="brain-icon">🧠</div>
                        </div>

                        {/* Welcome Text */}
                        <div className="text-center mb-8">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">
                                Welcome to InterviewAI
                            </h1>
                            <p className="text-gray-600">
                                Sign in to continue
                            </p>
                        </div>

                        {/* Error/Success Messages */}
                        {error && (
                            <div className="error-message">
                                {error}
                            </div>
                        )}
                        
                        {success && (
                            <div className="success-message">
                                {success}
                            </div>
                        )}


                        {/* Login Form */}
                        <form onSubmit={handleEmailLogin}>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    className="input-field"
                                    placeholder="you@example.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    disabled={isLoading}
                                />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    className="input-field"
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    disabled={isLoading}
                                />
                            </div>

                            <button 
                                type="submit" 
                                className="sign-in-btn"
                                disabled={isLoading}
                            >
                                {isLoading ? (
                                    <div className="flex items-center justify-center">
                                        <div className="loading"></div>
                                        <span className="ml-2">Signing in...</span>
                                    </div>
                                ) : (
                                    'Sign in'
                                )}
                            </button>
                        </form>

                        {/* Footer Links */}
                        <div className="footer-links">
                            <div>
                                <span>Need an account? </span>
                                <button 
                                    onClick={handleSignUp}
                                    className="text-blue-600 hover:underline bg-transparent border-none cursor-pointer"
                                >
                                    Sign up
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        ReactDOM.render(<LoginPage />, document.getElementById('root'));
    </script>
</body>
</html>
